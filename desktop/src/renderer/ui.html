<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'self'">
<title>dsh-desktop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <strong>dsh-desktop</strong>
    <span id="variant-badge" class="badge"></span>
    <span id="server-badge" class="badge badge-info"></span>
    <span class="spacer"></span>
    <button id="btn-logs" class="ghost" type="button">日志</button>
    <button id="btn-settings" class="ghost" type="button">设置</button>
  </header>

  <!-- ── Bootstrap view ── -->
  <section id="view-bootstrap" class="view" hidden>
    <h2>环境准备（Slim 版）</h2>
    <p class="muted">桌面版需要 Node.js ≥ 22.19 与 dsh。检测到缺失项后将引导安装。</p>
    <div id="bootstrap-env" class="env-list"></div>
    <div id="bootstrap-steps" class="env-list"></div>
    <div class="actions">
      <button id="btn-env-check" type="button">重新检测</button>
      <button id="btn-bootstrap-run" class="primary" type="button">开始引导安装</button>
      <button id="btn-bootstrap-cancel" class="ghost" type="button">取消</button>
    </div>
    <p id="bootstrap-note" class="muted"></p>
  </section>

  <!-- ── Log view ── -->
  <section id="view-log" class="view" hidden>
    <div class="view-head">
      <h2>日志</h2>
      <div class="actions">
        <label><input id="log-autoscroll" type="checkbox" checked> 自动滚动</label>
        <button id="btn-log-clear" class="ghost" type="button">清空</button>
        <button id="btn-log-export" class="ghost" type="button">导出</button>
      </div>
    </div>
    <pre id="log-output" class="log-box" tabindex="0"></pre>
  </section>

  <!-- ── Settings view ── -->
  <section id="view-settings" class="view" hidden>
    <h2>设置</h2>
    <form id="settings-form" class="form">
      <label>端口（0 = 自动分配）
        <input id="set-port" type="number" min="0" max="65535" required>
      </label>
      <label class="row"><input id="set-close-tray" type="checkbox"> 关闭窗口时最小化到托盘</label>
      <label class="row"><input id="set-autolaunch" type="checkbox"> 开机自启</label>
      <label>dsh 数据目录（留空 = ~/.dsh）
        <span class="row">
          <input id="set-datadir" type="text" placeholder="~/.dsh">
          <button id="btn-browse" class="ghost" type="button">浏览…</button>
        </span>
      </label>
      <label>下载镜像（留空 = 官方源，如 https://npmmirror.com/mirrors/node）
        <input id="set-mirror" type="url" placeholder="https://…">
      </label>
      <label class="row"><input id="set-autodownload" type="checkbox"> 允许引导时自动下载（每次均需确认）</label>
      <div class="actions">
        <button id="btn-settings-save" class="primary" type="submit">保存</button>
        <span id="settings-saved" class="muted" hidden>已保存 ✓</span>
      </div>
    </form>
    <hr>
    <h3>更新</h3>
    <p id="update-status" class="muted">未检查</p>
    <div class="actions">
      <button id="btn-update-check" type="button">检查更新</button>
      <button id="btn-update-download" class="ghost" type="button" hidden>下载更新</button>
      <button id="btn-update-install" class="primary" type="button" hidden>重启安装</button>
    </div>
  </section>

  <!-- ── Crash view ── -->
  <section id="view-crash" class="view" hidden>
    <h2>dsh server 异常</h2>
    <p id="crash-detail" class="muted"></p>
    <div class="actions">
      <button id="btn-crash-restart" class="primary" type="button">重启 server</button>
      <button id="btn-crash-logs" class="ghost" type="button">打开日志</button>
      <button id="btn-crash-quit" class="ghost" type="button">退出</button>
    </div>
  </section>

  <footer class="statusbar">
    <span id="foot-variant"></span>
    <span id="foot-server"></span>
    <span id="foot-update"></span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
