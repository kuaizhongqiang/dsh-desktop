# Release: build Full + Slim installers (NSIS), sign when secrets are present,
# publish both to a GitHub Release (electron-updater feed via latest*.yml).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signing is opt-in: provide CSC_LINK + CSC_KEY_PASSWORD secrets to sign.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # electron-builder 422s when a release already exists for the tag; make
      # re-runs idempotent by removing any stale release first.
      - name: Clean stale release (idempotent re-runs)
        run: |
          gh release delete "$env:GITHUB_REF_NAME" --yes 2>$null
          exit 0

      - name: Build app + icon
        run: |
          npm run build
          npm run make:icon

      # Full variant inputs: bundled official Node + dsh npm-locked package (D6)
      - name: Prepare dsh bundle (Full)
        run: node scripts/prepare-dsh.mjs

      - name: Fetch official Node (Full)
        run: node scripts/fetch-node.mjs

      - name: "Smoke: bundled dsh boots and serves the Web UI"
        run: node scripts/smoke.mjs --dsh resources/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js

      - name: Package Full (NSIS)
        run: npx electron-builder --config electron-builder.full.yml --publish never

      - name: Package Slim (NSIS)
        run: npx electron-builder --config electron-builder.slim.yml --publish never

      # electron-builder's own GitHub publisher is flaky (list-endpoint
      # eventual consistency causes 422 on re-create); publish explicitly.
      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "$env:GITHUB_REF_NAME"
          $files = @(
            "release/full/dsh-desktop-full-$ver-setup.exe",
            "release/full/dsh-desktop-full-$ver-setup.exe.blockmap",
            "release/full/full.yml",
            "release/slim/dsh-desktop-slim-$ver-setup.exe",
            "release/slim/dsh-desktop-slim-$ver-setup.exe.blockmap",
            "release/slim/slim.yml"
          )
          foreach ($f in $files) { if (-not (Test-Path $f)) { throw "missing artifact: $f" } }
          gh release create $tag $files --title "dsh-desktop $ver" --notes "dsh-desktop $ver — Full (自包含) / Slim (引导) 双版本。"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          Write-Host "published $tag with $($files.Count) assets"

      - name: List artifacts
        run: Get-ChildItem release/full, release/slim -File | Select-Object FullName, Length
